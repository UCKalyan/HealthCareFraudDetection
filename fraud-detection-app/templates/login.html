<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FraudGuard</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8 animate-float">
            <div class="inline-block p-4 bg-white rounded-2xl shadow-2xl mb-4">
                <img src="/static/images/logo.png" alt="FraudGuard Logo" class="w-20 h-20">
            </div>
            <h1 class="text-4xl font-display font-bold text-white mb-2">FraudGuard</h1>
            <p class="text-purple-100 text-sm">AI-Powered Healthcare Fraud Detection</p>
        </div>

        <!-- Login Card -->
        <div class="glass rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-display font-bold text-gray-800 mb-6 text-center">Welcome Back</h2>

            {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-600 flex items-center gap-2">
                    <span>⚠️</span>
                    <span>{{ error }}</span>
                </p>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        placeholder="Enter your username">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        placeholder="Enter your password">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition-all hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                    Sign In
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="text-xs font-semibold text-blue-900 mb-2 flex items-center gap-2">
                    <span>ℹ️</span>
                    <span>Demo Credentials</span>
                </p>
                <div class="text-xs text-blue-700 space-y-1">
                    <p><strong>Username:</strong> <code class="bg-blue-100 px-2 py-0.5 rounded">admin</code></p>
                    <p><strong>Password:</strong> <code class="bg-blue-100 px-2 py-0.5 rounded">fraud2025</code></p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-purple-100 text-xs">
            <p>&copy; 2025 FraudGuard. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
