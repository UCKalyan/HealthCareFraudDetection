<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard - Fraud Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-display {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                    </path>
                </svg>
            </div>
            <h1 class="text-xl font-display font-bold text-slate-800">Supervisor Console</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-slate-500">Logged in as <span class="font-bold text-slate-800">{{ username
                    }}</span></span>
            <a href="/logout" class="text-sm text-red-600 hover:text-red-800 font-medium">Logout</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-8">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-2xl font-display font-bold text-slate-800 mb-6">Pending Review Cases</h2>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                Provider</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                NPI</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                Submitted By</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                Timestamp</th>
                            <th
                                class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">
                                Action</th>
                        </tr>
                    </thead>
                    <tbody id="casesTableBody" class="bg-white divide-y divide-slate-200">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Case Review Modal (Reusing structure from dashboard) -->
    <div id="reviewModal"
        class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-display font-bold text-lg text-slate-800">Case Review</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                <div id="reportContent">
                    <!-- Report loaded here via AJAX -->
                    <div class="text-center py-12">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                        <p class="mt-4 text-slate-500">Loading Analysis...</p>
                    </div>
                </div>
            </div>

            <!-- Supervisor Action Panel -->
            <div class="px-6 py-4 border-t border-slate-200 bg-white">
                <h4 class="font-bold text-slate-800 mb-3">Make Decision</h4>
                <div class="flex gap-4">
                    <button onclick="submitDecision('STOP PAYMENT')"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-bold transition-colors">⛔
                        STOP PAYMENT</button>
                    <button onclick="submitDecision('HOLD PAYMENT')"
                        class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-bold transition-colors">✋
                        HOLD PAYMENT</button>
                    <button onclick="submitDecision('REVIEW CLAIM')"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold transition-colors">🔍
                        REVIEW CLAIM</button>
                    <button onclick="submitDecision('RELEASE PAYMENT')"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold transition-colors">✅
                        RELEASE PAYMENT</button>
                </div>
                <textarea id="decisionNotes" class="w-full mt-3 p-2 border border-slate-300 rounded-lg text-sm"
                    placeholder="Add notes for the payments team..."></textarea>
            </div>
        </div>
    </div>

    <script>
        let currentCaseId = null;

        async function loadCases() {
            const res = await fetch('/api/cases/pending');
            const cases = await res.json();
            const tbody = document.getElementById('casesTableBody');
            tbody.innerHTML = '';

            if (cases.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-slate-500">No pending cases.</td></tr>';
                return;
            }

            cases.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-slate-900">${c.provider_name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-500 font-mono">${c.npi}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-500">${c.submitted_by}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-500 text-sm">${new Date(c.timestamp).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="openCase(${c.id}, '${c.npi}')" class="text-indigo-600 hover:text-indigo-900 font-bold">Review</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function openCase(id, npi) {
            currentCaseId = id;
            document.getElementById('reviewModal').classList.remove('hidden');

            // Load Analysis Report (Reusing existing endpoint)
            // Note: In a real app, we might want a dedicated endpoint that returns the stored report
            // For now, we'll re-run analysis or fetch from cache to show the report
            const res = await fetch('/analyze_provider', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `npi=${npi}`
            });
            const data = await res.json();

            // Render Report (Simplified version of dashboard logic)
            const contentDiv = document.getElementById('reportContent');
            contentDiv.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">${data.name}</h2>
                    <p class="text-slate-500">NPI: ${npi} | Specialty: ${data.specialty}</p>
                    <div class="mt-4 flex items-center gap-4">
                        <div class="text-3xl font-bold text-slate-900">Score: ${data.finalScore.toFixed(2)}</div>
                        <div class="px-3 py-1 rounded-full text-sm font-bold ${data.risk === 'High' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">${data.risk} Risk</div>
                    </div>
                </div>
                
                <div class="bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-2">👮 Supervisor Agent Recommendation</h3>
                    <div class="text-sm font-medium text-slate-800">${data.supervisorRecommendation || 'None'}</div>
                </div>

                <div class="prose prose-slate max-w-none">
                    ${data.analystFinding}
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('reviewModal').classList.add('hidden');
        }

        async function submitDecision(decision) {
            const notes = document.getElementById('decisionNotes').value;
            if (!notes && (decision === 'STOP PAYMENT' || decision === 'HOLD PAYMENT')) {
                alert('Please provide notes for Stop/Hold decisions.');
                return;
            }

            const res = await fetch('/api/cases/decide', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    case_id: currentCaseId,
                    decision: decision,
                    notes: notes
                })
            });

            const result = await res.json();
            if (result.status === 'success') {
                alert('Decision recorded and email sent.');
                closeModal();
                loadCases();
            } else {
                alert('Error: ' + result.detail);
            }
        }

        loadCases();
    </script>
</body>

</html>
