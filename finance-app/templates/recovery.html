{% extends "base.html" %}

{% block title %}Payment Recovery - Finance Application{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-800">Payment Recovery Management</h1>
        <div class="flex gap-2">
            <select id="statusFilter" onchange="loadRecoveryRequests()" class="px-4 py-2 border rounded-lg">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="APPROVED">Approved</option>
                <option value="REJECTED">Rejected</option>
                <option value="IN_PROCESS">In Process</option>
                <option value="COMPLETED">Completed</option>
            </select>
            <button onclick="loadRecoveryRequests()"
                class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                🔄 Refresh
            </button>
        </div>
    </div>

    <!-- Stats Summary -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="stats-summary">
        <!-- Will be populated by JavaScript -->
    </div>

    <!-- Recovery Requests Queue -->
    <div class="glass rounded-xl p-6 shadow-lg">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">Recovery Requests</h2>
        <div id="recoveryQueue" class="space-y-4">
            <div class="text-center py-8 text-gray-500">
                <p>Loading recovery requests...</p>
            </div>
        </div>
    </div>
</div>

<!-- Recovery Details Modal -->
<div id="detailsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Recovery Request Details</h2>
            <button onclick="closeDetailsModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    let allRecoveryRequests = [];

    async function loadRecoveryRequests() {
        const statusFilter = document.getElementById('statusFilter').value;
        const url = `/api/recovery/requests${statusFilter ? `?status=${statusFilter}` : ''}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            allRecoveryRequests = data.recovery_requests || [];

            displayRecoveryRequests();
            updateStats();
        } catch (error) {
            console.error('Error loading recovery requests:', error);
            document.getElementById('recoveryQueue').innerHTML = `
            <div class="text-center py-8 text-red-600">
                <p>Error loading recovery requests: ${error.message}</p>
            </div>
        `;
        }
    }

    function updateStats() {
        const pending = allRecoveryRequests.filter(r => r.recovery_status === 'PENDING').length;
        const approved = allRecoveryRequests.filter(r => r.recovery_status === 'APPROVED').length;
        const total = allRecoveryRequests.length;
        const totalAmount = allRecoveryRequests
            .filter(r => r.recovery_status === 'PENDING')
            .reduce((sum, r) => sum + (r.original_payment_amount || 0), 0);

        document.getElementById('stats-summary').innerHTML = `
        <div class="glass p-4 rounded-lg">
            <p class="text-sm text-gray-600">Pending Review</p>
            <p class="text-2xl font-bold text-yellow-600">${pending}</p>
        </div>
        <div class="glass p-4 rounded-lg">
            <p class="text-sm text-gray-600">Approved</p>
            <p class="text-2xl font-bold text-green-600">${approved}</p>
        </div>
        <div class="glass p-4 rounded-lg">
            <p class="text-sm text-gray-600">Total Requests</p>
            <p class="text-2xl font-bold text-purple-600">${total}</p>
        </div>
        <div class="glass p-4 rounded-lg">
            <p class="text-sm text-gray-600">Pending Amount</p>
            <p class="text-2xl font-bold text-blue-600">$${totalAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
        </div>
    `;
    }

    function displayRecoveryRequests() {
        const queue = document.getElementById('recoveryQueue');

        if (allRecoveryRequests.length === 0) {
            queue.innerHTML = `
            <div class="text-center py-8 text-gray-500">
                <p>No recovery requests found</p>
            </div>
        `;
            return;
        }

        queue.innerHTML = allRecoveryRequests.map(request => {
            const statusColors = {
                'PENDING': 'bg-yellow-100 text-yellow-800 border-yellow-300',
                'APPROVED': 'bg-green-100 text-green-800 border-green-300',
                'REJECTED': 'bg-red-100 text-red-800 border-red-300',
                'IN_PROCESS': 'bg-blue-100 text-blue-800 border-blue-300',
                'COMPLETED': 'bg-gray-100 text-gray-800 border-gray-300'
            };

            const levelColors = {
                'L1_REVIEW': 'bg-blue-100 text-blue-700',
                'L2_APPROVAL': 'bg-orange-100 text-orange-700',
                'LEGAL_REVIEW': 'bg-red-100 text-red-700'
            };

            return `
            <div class="glass p-5 rounded-lg border-l-4 ${request.recovery_status === 'PENDING' ? 'border-yellow-500' : 'border-gray-300'}">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <h3 class="text-lg font-semibold">NPI: ${request.npi}</h3>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColors[request.recovery_status] || 'bg-gray-100'}">
                                ${request.recovery_status}
                            </span>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${levelColors[request.approval_level] || 'bg-gray-100'}">
                                ${request.approval_level}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div>
                                <span class="text-gray-600">Provider:</span>
                                <span class="font-semibold">${request.provider_name || 'N/A'}</span>
                            </div>
                            <div>
                                <span class="text-gray-600">State:</span>
                                <span class="font-semibold">${request.provider_state || 'N/A'}</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Amount:</span>
                                <span class="font-semibold text-red-600">$${(request.original_payment_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Fraud Score:</span>
                                <span class="font-semibold text-red-600">${((request.fraud_risk_score || 0) * 100).toFixed(1)}%</span>
                            </div>
                            <div class="col-span-2">
                                <span class="text-gray-600">Initiated:</span>
                                <span class="font-semibold">${new Date(request.created_at).toLocaleString()}</span>
                                <span class="text-gray-600 ml-4">by ${request.initiated_by}</span>
                            </div>
                        </div>
                        
                        <!-- Transaction Details Section -->
                        <div class="mt-3 pt-3 border-t border-gray-200">
                            <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Transaction Details</h4>
                            <div class="grid grid-cols-2 gap-3 text-sm bg-gray-50 p-3 rounded">
                                <div>
                                    <span class="text-gray-600 text-xs">Transaction ID:</span>
                                    <p class="font-mono text-xs text-gray-800 break-all" title="${request.transaction_id}">${request.transaction_id}</p>
                                </div>
                                <div>
                                    <span class="text-gray-600 text-xs">Payment Date:</span>
                                    <p class="font-semibold text-gray-800">${request.payment_date || 'N/A'}</p>
                                </div>
                                <div>
                                    <span class="text-gray-600 text-xs">Processed Date:</span>
                                    <p class="font-semibold text-gray-800">${request.payment_processed_date || 'N/A'}</p>
                                </div>
                                <div>
                                    <span class="text-gray-600 text-xs">Status:</span>
                                    <span class="px-2 py-0.5 rounded text-xs font-semibold ${request.payment_status === 'PROCESSED' ? 'bg-green-100 text-green-800' : 'bg-gray-100'}">
                                        ${request.payment_status || 'UNKNOWN'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 ml-4">
                        ${request.recovery_status === 'PENDING' ? `
                            <button onclick="approveRecovery('${request.recovery_id}', this)" 
                                class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm whitespace-nowrap transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                ✓ Approve
                            </button>
                            <button onclick="rejectRecovery('${request.recovery_id}', this)" 
                                class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm whitespace-nowrap transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                ✗ Reject
                            </button>
                        ` : ''}
                        <button onclick="viewDetails('${request.recovery_id}')" 
                            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm whitespace-nowrap">
                            📋 Details
                        </button>
                    </div>
                </div>
            </div>
        `;
        }).join('');
    }

    async function approveRecovery(recoveryId, btnElement) {
        const recovery = allRecoveryRequests.find(r => r.recovery_id === recoveryId);
        if (!recovery) return;

        const method = prompt('Enter recovery method (RECOUPMENT, OFFSET, DEMAND_LETTER, LEGAL_ACTION):', 'RECOUPMENT');
        if (!method) return;

        const notes = prompt('Enter approval notes:', '');

        // Set loading state
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '⏳ Processing...';
        btnElement.disabled = true;

        try {
            const response = await fetch(`/api/recovery/${recoveryId}/approve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    approver: '{{ user.username }}',
                    notes: notes,
                    recovery_method: method
                })
            });

            if (response.ok) {
                // alert('Recovery approved successfully!'); // Optional: remove alert for smoother flow
                showToast('Recovery approved successfully!', 'success');
                loadRecoveryRequests();
            } else {
                showToast('Error approving recovery', 'error');
                // Restore state on error
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        } catch (error) {
            showToast(`Error: ${error.message}`, 'error');
            // Restore state on error
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
        }
    }

    async function rejectRecovery(recoveryId, btnElement) {
        const notes = prompt('Enter rejection reason:', '');
        if (!notes) return;

        // Set loading state
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '⏳ Processing...';
        btnElement.disabled = true;

        try {
            const response = await fetch(`/api/recovery/${recoveryId}/reject`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    rejector: '{{ user.username }}',
                    notes: notes
                })
            });

            if (response.ok) {
                // alert('Recovery rejected');
                showToast('Recovery rejected', 'success');
                loadRecoveryRequests();
            } else {
                showToast('Error rejecting recovery', 'error');
                // Restore state on error
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        } catch (error) {
            showToast(`Error: ${error.message}`, 'error');
            // Restore state on error
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
        }
    }

    function viewDetails(recoveryId) {
        const recovery = allRecoveryRequests.find(r => r.recovery_id === recoveryId);
        if (!recovery) return;

        let evidence = {};
        try {
            evidence = JSON.parse(recovery.fraud_evidence || '{}');
        } catch (e) {
            evidence = {};
        }

        document.getElementById('modalContent').innerHTML = `
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm text-gray-600">Recovery ID</label>
                    <p class="font-mono text-sm">${recovery.recovery_id}</p>
                </div>
                <div>
                    <label class="text-sm text-gray-600">Transaction ID</label>
                    <p class="font-mono text-sm">${recovery.transaction_id}</p>
                </div>
                <div>
                    <label class="text-sm text-gray-600">Provider NPI</label>
                    <p class="font-semibold">${recovery.npi} - ${recovery.provider_name || 'N/A'}</p>
                </div>
                <div>
                    <label class="text-sm text-gray-600">Original Amount</label>
                    <p class="font-semibold text-red-600">$${(recovery.original_payment_amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</p>
                </div>
                <div>
                    <label class="text-sm text-gray-600">Fraud Risk Score</label>
                    <p class="font-semibold text-red-600">${((recovery.fraud_risk_score || 0) * 100).toFixed(2)}%</p>
                </div>
                <div>
                    <label class="text-sm text-gray-600">Status</label>
                    <p class="font-semibold">${recovery.recovery_status}</p>
                </div>
            </div>
            
            ${evidence.reasoning ? `
            <div>
                <label class="text-sm text-gray-600 font-semibold">Fraud Reasoning</label>
                <p class="text-sm mt-1 p-3 bg-gray-50 rounded">${evidence.reasoning}</p>
            </div>
            ` : ''}
            
            ${evidence.investigation ? `
            <div>
                <label class="text-sm text-gray-600 font-semibold">Investigation Findings</label>
                <p class="text-sm mt-1 p-3 bg-gray-50 rounded">${evidence.investigation}</p>
            </div>
            ` : ''}
            
            ${evidence.shap_values && evidence.shap_values.length > 0 ? `
            <div>
                <label class="text-sm text-gray-600 font-semibold">Top Risk Factors (SHAP)</label>
                <div class="mt-2 space-y-1">
                    ${evidence.shap_values.slice(0, 5).map(shap => `
                        <div class="flex justify-between text-sm p-2 bg-gray-50 rounded">
                            <span>${shap.name || shap.feature}</span>
                            <span class="font-mono ${shap.value > 0 ? 'text-red-600' : 'text-green-600'}">${shap.value?.toFixed(4)}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
            ` : ''}
            
            ${recovery.approver ? `
            <div>
                <label class="text-sm text-gray-600 font-semibold">Approval Info</label>
                <p class="text-sm mt-1">Approver: ${recovery.approver}</p>
                <p class="text-sm">Notes: ${recovery.approval_notes || 'N/A'}</p>
                ${recovery.recovery_method ? `<p class="text-sm">Method: ${recovery.recovery_method}</p>` : ''}
            </div>
            ` : ''}
        </div>
    `;

        document.getElementById('detailsModal').classList.remove('hidden');
    }

    function closeDetailsModal() {
        document.getElementById('detailsModal').classList.add('hidden');
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
        loadRecoveryRequests();
        setInterval(loadRecoveryRequests, 30000); // Refresh every 30 seconds
    });
</script>
{% endblock %}
